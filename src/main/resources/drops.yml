# ============================================================
# OreFlow - Drop Configuration
# Add your own drops by creating new sections!
#
# Config version - DO NOT MODIFY. Used for automatic migrations.
config-version: 1
#
# required-tool: minimum required pickaxe tier:
#   WOODEN_PICKAXE / GOLDEN_PICKAXE (tier 1)
#   STONE_PICKAXE (tier 2)
#   IRON_PICKAXE (tier 3)
#   DIAMOND_PICKAXE (tier 4)
#   NETHERITE_PICKAXE (tier 5)
# A better pickaxe automatically satisfies lower tier requirements.
#
# fortune:
#   enabled: whether Fortune affects this drop
#   levels:
#     1/2/3:
#       chance: chance for additional items with that Fortune level
#       bonus-min: minimum additional amount
#       bonus-max: maximum additional amount
# ============================================================

# Diamond
diamond:
  material: "DIAMOND"
  chance: 2.0
  min-amount: 1
  max-amount: 1
  required-tool: "IRON_PICKAXE"
  min-y: -64
  max-y: 16
  exp: 10
  enabled: true
  fortune:
    enabled: true
    levels:
      '1': { chance: 33.0, bonus-min: 1, bonus-max: 1 }
      '2': { chance: 50.0, bonus-min: 1, bonus-max: 2 }
      '3': { chance: 75.0, bonus-min: 2, bonus-max: 3 }

