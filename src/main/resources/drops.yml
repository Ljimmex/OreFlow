# ============================================================
# OreFlow - Drop Configuration
# Dodaj wlasne dropy tworzac nowe sekcje!
#
# required-tool: wymagany MINIMALNY tier kilofa:
#   WOODEN_PICKAXE / GOLDEN_PICKAXE (tier 1)
#   STONE_PICKAXE (tier 2)
#   IRON_PICKAXE (tier 3)
#   DIAMOND_PICKAXE (tier 4)
#   NETHERITE_PICKAXE (tier 5)
# Lepszy kilof automatycznie spelnia wymaganie nizszego tieru.
# ============================================================

# Przyklad: Diament
diamond:

  # Material zgodny z enum Material Bukkit
  material: "DIAMOND"

  # Szansa w procentach (0.0 - 100.0)
  chance: 2.0

  # Minimalna i maksymalna ilosc (przed Fortune)
  min-amount: 1
  max-amount: 1

  # Czy Fortune wplywa na ten drop
  fortune-multiplier: true

  # Wymagane narzedzie (puste = dowolne)
  required-tool: "IRON_PICKAXE"

  # Zakres poziomow Y (puste = wszystkie)
  min-y: -64
  max-y: 320

  # Ilosc EXP za ten drop
  exp: 10

  # Czy drop domyslnie wlaczony
  enabled: true

