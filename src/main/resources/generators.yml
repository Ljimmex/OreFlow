# ============================================================
# OreFlow - Stone Generator Configuration
# ============================================================

generators:
  # Basic stone generator
  basic:
    # Whether the generator is enabled
    enabled: true

    # Crafting recipe (3x3 grid)
    # R = Redstone, I = Iron Ingot, S = Stone, P = Piston
    crafting:
      shape:
        - "RIR"
        - "ISI"
        - "RPR"
      ingredients:
        R: "REDSTONE"
        I: "IRON_INGOT"
        S: "STONE"
        P: "PISTON"

    # Block received after crafting
    item:
      material: "END_STONE"
      name: "&8&lStoniarka"
      lore:
        - "&7Place to generate stone"
        - "&7Stone regrows after mining"
        - ""
        - "&eInterval: &f{interval}s"
      # Optional glow effect
      enchant-glow: true

    # Generation parameters
    generation:
      # Type of block generated above the generator
      material: "STONE"

      # Time between generation attempts (in seconds)
      interval: 3

      # Whether a player must be nearby for the generator to work
      require-player-nearby: true

      # Radius in blocks within which a player must be
      radius: 32

      # Effects on generation
      effects:
        sound: "BLOCK_STONE_PLACE"
        particle: "CLOUD"
        particle-count: 5

    # Whether breaking the generator returns its item
    pickup-on-break: true
