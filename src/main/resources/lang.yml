# ============================================================
# OreFlow - Language Configuration (Polski)
# Zmienne: {player}, {drop}, {amount}, {material}, {exp}, {fortune}
# ============================================================

# Komendy
commands:
  no-permission: "&cNie masz uprawnien do tej komendy! (&e{permission}&c)"
  player-only: "&cTej komendy moze uzyc tylko gracz!"
  reload-success: "&a&lSUKCES! &aPrzeladowano konfiguracje OreFlow w &e{time}ms&a."
  reload-error: "&c&lBLAD! &cNie udalo sie przeladowac konfiguracji. Sprawdz konsole."
  invalid-drop: "&cDrop &e{drop} &cnie istnieje w konfiguracji!"
  drop-toggled-on: "&a&lWLACZONO! &aDrop &e{drop} &azostal wlaczony."
  drop-toggled-off: "&c&lWYLACZONO! &cDrop &e{drop} &czostal wylaczony."
  cobble-enabled: "&aDrop cobblestone zostal &awlaczony&a."
  cobble-disabled: "&cDrop cobblestone zostal &cwylaczony&c."
  player-not-found: "&cNie znaleziono gracza: &e{player}"

# GUI
gui:
  title: "&8&lZarzadzaj dropami ze stone"
  title-admin: "&8&lPanel Admina - Dropy"

  # Informacje o dropie (po lewym kliknieciu)
  drop-info:
    - "&8&m--------------------"
    - "&fMaterial: &e{material}"
    - "&fSzansa: &e{chance}%"
    - "&fIlosc: &e{min}-{max}"
    - "&fFortune: &e{fortune_enabled}"
    - "&fWymagany kilof: &e{tool}"
    - "&fPoziom Y: &e{min_y}-{max_y}"
    - "&fEXP: &e{exp}"
    - "&8&m--------------------"
    - "&7Prawy przycisk - wlacz/wylacz"

  # Szanse Fortune w GUI
  fortune-chances:
    title: "&eSzanse Fortune:"
    format: "&fFortune {level}: &e{chance}x srednio"

  # Przyciski nawigacji
  buttons:
    next-page: "&aNastepna strona &7>>"
    prev-page: "&7<< &aPoprzednia strona"
    close: "&cZamknij"

# Action Bar
actionbar:
  drop-success:
    enabled: true
    message: "&6+&e{amount}x &6{material}"
    duration: 40
  drop-disabled:
    enabled: false
    message: "&7Drop &e{material} &7jest wylaczony"
    duration: 40
  exp-gained:
    enabled: true
    message: "&b+{exp} EXP"
    duration: 40
  generator-placed:
    enabled: true
    message: "&aStoniarka postawiona!"
    duration: 60
  generator-ready:
    enabled: true
    message: "&eStoniarka gotowa!"
    duration: 40
