# ============================================================
# OreFlow - Main Configuration
# Documentation: https://github.com/Ljinmex/OreFlow/wiki
# ============================================================

# Config version - DO NOT MODIFY. Used for automatic migrations.
config-version: 1

# Main plugin settings
settings:

  # Default language (pl, en, de)
  language: "pl"

  # Whether the plugin should only work in the listed worlds (whitelist)
  # or in all worlds except the listed ones (blacklist)
  world-mode: "blacklist"

  # World list
  worlds:
    - "world_nether"
    - "world_the_end"

  # Maximum number of drops from one mineable block (0 = unlimited)
  max-drops-per-block: 3

  # Default setting: should drops go directly to the inventory (true)
  # or fall on the ground (false). Players can change this in the GUI.
  drop-to-inventory: true

  # Default setting: should mining EXP be granted
  # Players can change this in the GUI.
  exp-enabled: true

  # Legacy aliases - left for compatibility, not used
  disable-default-drops: true
  disable-cobble-drop: true

  # Default setting: is cobblestone drop from stone enabled
  # for new players. Each player can change this in the GUI or via /oreflow cobble.
  cobblestone-enabled: false

  # Base amount of EXP for breaking a block from the mineable-blocks list
  base-exp: 1

  # Global EXP multiplier (multiplies all EXP sources)
  exp-multiplier: 1.0

  # EXP grant mode: "direct-give" or "orb-spawn"
  exp-mode: "direct-give"

  # Stone blocks configurable by the admin.
  # Ores (COAL_ORE, DIAMOND_ORE, etc.) are hardcoded in the plugin
  # and are always handled by the plugin - no need to add them here.
  mineable-blocks:
    - "STONE"
    - "ANDESITE"
    - "DIORITE"
    - "GRANITE"
    - "CALCITE"
    - "TUFF"
    - "DEEPSLATE"

# Fortune system settings
fortune:

  # Whether Fortune should affect drops
  enabled: true

  # Whether to consider Fortune levels above III (e.g. from other plugins)
  allow-higher-fortune: false

# ============================================================
# CobbleX - Reward box system
# Basic version - expansion in Sprint 11
# ============================================================
cobblex:

  # Whether CobbleX is enabled
  enabled: true

  # CobbleX item
  item:
    material: "ENDER_CHEST"
    name: "<dark_gray><bold>CobbleX</bold></dark_gray>"
    lore:
      - "<gray>A chest made from 9 stacks of cobblestone</gray>"
      - "<gray>Right-click to open and roll a reward</gray>"
      - ""
      - "<yellow>Crafting cost: </yellow><white>9 stacks of cobblestone</white>"
    enchant-glow: true

  # Crafting in the crafting table (3x3)
  # Each slot = one stack of cobblestone
  crafting:
    enabled: true
    cost-per-slot: 64

  # Cooldown between openings (in seconds)
  cooldown: 2

  # Reward pool (basic version)
  # command: command executed as console, %player = player name
  # message: Action Bar message
  drops:
    diamonds:
      command: "give %player DIAMOND 3"
      message: "<green>Rolled: </green><white>3x Diamond</white>"
      chance: 8
    gold:
      command: "give %player GOLD_INGOT 8"
      message: "<green>Rolled: </green><white>8x Gold</white>"
      chance: 15
    iron:
      command: "give %player IRON_INGOT 16"
      message: "<green>Rolled: </green><white>16x Iron</white>"
      chance: 20
    emerald:
      command: "give %player EMERALD 4"
      message: "<green>Rolled: </green><white>4x Emerald</white>"
      chance: 10
    curse_nausea:
      command: "effect %player NAUSEA 10"
      message: "<red>Curse! Nausea for 10s</red>"
      chance: 12
    curse_blindness:
      command: "effect %player BLINDNESS 5"
      message: "<red>Curse! Blindness for 5s</red>"
      chance: 10
    empty:
      command: ""
      message: "<gray>Empty...</gray>"
      chance: 15
    cobble_refund:
      command: "give %player COBBLESTONE 64"
      message: "<gray>Refund: 64x Cobblestone</gray>"
      chance: 10
