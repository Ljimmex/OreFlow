status:
  enabled: "<green>Aktiviert</green>"
  disabled: "<red>Deaktiviert</red>"
  inventory: "<green>Inventar</green>"
  ground: "<red>Boden</red>"

# Action Bar
actionbar:
  prefix: "<#5555FF><bold>OreFlow</bold></#5555FF>"
  drop-success:
    enabled: true
    message: "{prefix} <dark_gray>» <white>✦ <white>+{amount} {material}"
    duration: 40
  drop-success-multi:
    enabled: true
    message: "{prefix} <dark_gray>» {drops}"
    duration: 40
  creative:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Kreativmodus <dark_gray>– <gray>Keine Drops"
    duration: 40
  ore-blocked:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Erze droppen auf diesem Server nicht"
    duration: 40
  generator-placed:
    enabled: true
    message: "<green>Generator platziert!</green>"
    duration: 60
  generator-ready:
    enabled: true
    message: "<yellow>Generator bereit!</yellow>"
    duration: 40

# GUI titles
# Note: most titles are configured in gui.yml
# These keys are used for chat messages and fallback titles
gui:
  title: "<dark_gray><bold>Stone-Drops verwalten</bold></dark_gray>"
  title-admin: "<dark_gray><bold>Admin-Panel - Drops</bold></dark_gray>"
  title-main-menu: "<gold><bold>OreFlow</bold></gold>"
  title-stone-generator: "<aqua><bold>Steingenerator</bold></aqua>"
  title-cobblex-menu: "<gold><bold>CobbleX</bold></gold>"
  title-cobblex-craft: "<gold><bold>CobbleX Crafting</bold></gold>"
  title-cobblex-drop: "<gold><bold>CobbleX Drops</bold></gold>"

  buttons:
    next-page: "<green>Nachste Seite </green><gray>>></gray>"
    prev-page: "<gray><< </gray><green>Vorherige Seite</green>"
    close: "<red>Schliessen</red>"

# GUI chat messages
gui-messages:
  drop-message-enabled: "<green>Drop-Nachricht fur </green><yellow>{drop} </yellow><green>wurde </green><dark_green>AKTIVIERT</dark_green><green>.</green>"
  drop-message-disabled: "<red>Drop-Nachricht fur </red><yellow>{drop} </yellow><red>wurde </red><dark_red>DEAKTIVIERT</dark_red><red>.</red>"
