  drop-toggled-off-other: "<red>Drop </red><yellow>{drop} </yellow><red>wurde fur </red><yellow>{target}</yellow><red> deaktiviert.</red>"
  drop-toggled-on-by: "<green>Drop </green><yellow>{drop} </yellow><green>wurde fur dich von </green><yellow>{player}</yellow><green> aktiviert.</green>"
