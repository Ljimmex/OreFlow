status:
  enabled: "<green>Wlaczony</green>"
  disabled: "<red>Wylaczony</red>"
  inventory: "<green>Ekwipunek</green>"
  ground: "<red>Ziemia</red>"

# Action Bar
actionbar:
  prefix: "<#5555FF><bold>OreFlow</bold></#5555FF>"
  drop-success:
    enabled: true
    message: "{prefix} <dark_gray>» <white>✦ <white>+{amount} {material}"
    duration: 40
  drop-success-multi:
    enabled: true
    message: "{prefix} <dark_gray>» {drops}"
    duration: 40
  creative:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Tryb Creative <dark_gray>– <gray>Brak dropu"
    duration: 40
  ore-blocked:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Rudy nie dropia na tym serwerze"
    duration: 40
  generator-placed:
    enabled: true
    message: "{prefix} <dark_gray>» <green>Stoniarka postawiona!"
    duration: 60
  generator-ready:
    enabled: true
    message: "<yellow>Stoniarka gotowa!</yellow>"
    duration: 40

# GUI titles
# Note: most titles are configured in gui.yml
# These keys are used for chat messages and fallback titles
gui:
  title: "<dark_gray><bold>Zarzadzaj dropami ze stone</bold></dark_gray>"
  title-admin: "<dark_gray><bold>Panel Admina - Dropy</bold></dark_gray>"
  title-main-menu: "<gold><bold>OreFlow</bold></gold>"
  title-stone-generator: "<aqua><bold>Stone Generator</bold></aqua>"
  title-cobblex-menu: "<gold><bold>CobbleX</bold></gold>"
  title-cobblex-craft: "<gold><bold>CobbleX Crafting</bold></gold>"
  title-cobblex-drop: "<gold><bold>CobbleX Drops</bold></gold>"

  buttons:
    next-page: "<green>Nastepna strona </green><gray>>></gray>"
    prev-page: "<gray><< </gray><green>Poprzednia strona</green>"
    close: "<red>Zamknij</red>"

# GUI chat messages
gui-messages:
  drop-message-enabled: "<green>Komunikat o dropie </green><yellow>{drop} </yellow><green>zostal </green><dark_green>WLACZONY</dark_green><green>.</green>"
  drop-message-disabled: "<red>Komunikat o dropie </red><yellow>{drop} </yellow><red>zostal </red><dark_red>WYLACZONY</dark_red><red>.</red>"
