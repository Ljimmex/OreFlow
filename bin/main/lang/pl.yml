status:
  enabled: "&aWlaczony"
  disabled: "&cWylaczony"
  inventory: "&aEkwipunek"
  ground: "&cZiemia"

# Action Bar
actionbar:
  prefix: "<#5555FF><bold>OreFlow</bold></#5555FF>"
  drop-success:
    enabled: true
    message: "{prefix} <dark_gray>» <white>✦ <white>+{amount} {material}"
    duration: 40
  drop-success-multi:
    enabled: true
    message: "{prefix} <dark_gray>» {drops}"
    duration: 40
  creative:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Tryb Creative <dark_gray>– <gray>Brak dropu"
    duration: 40
  ore-blocked:
    enabled: true
    message: "{prefix} <dark_gray>» <red>Rudy nie dropia na tym serwerze"
    duration: 40
  generator-placed:
    enabled: true
    message: "{prefix} <dark_gray>» <green>Stoniarka postawiona!"
    duration: 60
  generator-ready:
    enabled: true
    message: "&eStoniarka gotowa!"
    duration: 40

# GUI titles
# Note: most titles are configured in gui.yml
# These keys are used for chat messages and fallback titles
gui:
  title: "&8&lZarzadzaj dropami ze stone"
  title-admin: "&8&lPanel Admina - Dropy"
  title-main-menu: "&6&lOreFlow"
  title-stone-generator: "&b&lStone Generator"

  buttons:
    next-page: "&aNastepna strona &7>>"
    prev-page: "&7<< &aPoprzednia strona"
    close: "&cZamknij"

# GUI chat messages
gui-messages:
  drop-message-enabled: "&aKomunikat o dropie &e{drop} &azostal &2WLACZONY&a."
  drop-message-disabled: "&cKomunikat o dropie &e{drop} &czostal &4WYLACZONY&c."
